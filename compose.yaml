services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=user_service'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      # Host 3309 so the monolith (3306) and the two catalogues (3307/3308) can run alongside.
      - '3309:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pverysecret"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Gated behind the "full" profile so a bare `docker compose up` (and Spring
  # Boot's docker-compose dev support during `bootRun`) starts only MySQL.
  # Whole stack:  docker compose --profile full up --build
  app:
    profiles: ["full"]
    build:
      context: .
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/user_service?allowPublicKeyRetrieval=true&useSSL=false'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
    ports:
      - '8084:8084'
    depends_on:
      mysql:
        condition: service_healthy
