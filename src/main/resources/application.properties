spring.application.name=User

server.port=${SERVER_PORT:8084}

# --- Datasource --------------------------------------------------------------
# Own schema; no shared tables, no cross-service FKs. Recipe / ingredient ids
# stored here are plain values, not foreign keys.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/user_service?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}

# --- Schema: Flyway owns it, Hibernate only validates -----------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Operations ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- Tracing --------------------------------------------------------------
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# The checked-in API contract is served statically at /openapi.yaml.
